name: Package yt-dlp check

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: [self-hosted, homelab, mithium-sound]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --force
        env:
          npm_config_platform: win32
          npm_config_arch: x64

      - name: Build Windows artifacts and verify bundled yt-dlp
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_platform: win32
          npm_config_arch: x64
