<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865f2"/>
      <stop offset="100%" style="stop-color:#3b44b5"/>
    </linearGradient>
    <linearGradient id="mg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#d0d4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle inner highlight -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Sound wave arcs (left) -->
  <path d="M 90 256 A 50 50 0 0 1 90 206" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 72 256 A 80 80 0 0 1 72 176" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
  <!-- Sound wave arcs (right) -->
  <path d="M 422 256 A 50 50 0 0 0 422 306" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 440 256 A 80 80 0 0 0 440 336" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
  <!-- Letter M -->
  <path d="M 136 380 L 136 160 L 256 300 L 376 160 L 376 380"
        fill="none" stroke="url(#mg)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
