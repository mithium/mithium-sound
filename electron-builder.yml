appId: com.mithium.sound
productName: Mithium Sound
directories:
  output: dist
files:
  - src/**/*
  - package.json
asarUnpack:
  - node_modules/sql.js/dist/**
  - node_modules/@snazzah/davey-win32-x64-msvc/**
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/ffmpeg
    to: ffmpeg
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Mithium Sound
  uninstallDisplayName: Mithium Sound
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
publish:
  provider: github
  owner: mithium
  repo: mithium-sound
  releaseType: release
